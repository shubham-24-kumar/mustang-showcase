<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad-2013-shelby-gt500" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="50%" stop-color="#14141d"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d4d4d8"/>
      <stop offset="60%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="carBody-2013-shelby-gt500" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="glowGrad-2013-shelby-gt500" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Dark Atmospheric Backdrop -->
  <rect width="900" height="500" fill="url(#bgGrad-2013-shelby-gt500)"/>
  <ellipse cx="450" cy="280" rx="360" ry="120" fill="url(#glowGrad-2013-shelby-gt500)" filter="url(#blurFilter)"/>

  <!-- Technical Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="50" y1="100" x2="850" y2="100"/>
    <line x1="50" y1="200" x2="850" y2="200"/>
    <line x1="50" y1="300" x2="850" y2="300"/>
    <line x1="50" y1="400" x2="850" y2="400"/>
    <line x1="200" y1="50" x2="200" y2="450"/>
    <line x1="450" y1="50" x2="450" y2="450"/>
    <line x1="700" y1="50" x2="700" y2="450"/>
  </g>

  <!-- Speed Track / Ground Reflection -->
  <ellipse cx="450" cy="415" rx="380" ry="25" fill="#000000" opacity="0.8"/>
  <line x1="100" y1="420" x2="800" y2="420" stroke="#3b82f6" stroke-width="2" opacity="0.6" stroke-dasharray="16 12"/>

  <!-- Sleek Muscle Coupe Silhouette -->
  <!-- Main Body Shell -->
  <path d="M 120,380 C 135,340 180,310 240,290 C 310,265 420,240 540,250 C 660,260 740,310 780,380 Z" 
        fill="url(#carBody-2013-shelby-gt500)" stroke="#3f3f46" stroke-width="2"/>
  
  <!-- Cabin & Glass Greenhouse -->
  <path d="M 280,285 C 330,240 430,215 520,225 C 570,230 630,255 670,285 Z" 
        fill="#09090b" stroke="#52525b" stroke-width="1.5" opacity="0.95"/>
  <path d="M 330,280 C 365,245 440,230 510,235 C 550,240 595,260 625,280 Z" 
        fill="#18181b" opacity="0.7"/>

  <!-- Dual Racing Stripes -->
  <path d="M 430,220 L 442,220 L 436,380 L 424,380 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M 454,220 L 466,220 L 460,380 L 448,380 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Front & Rear Aerodynamics -->
  <path d="M 115,380 L 220,380 L 210,395 L 110,395 Z" fill="#18181b" stroke="#3b82f6" stroke-width="1"/>
  <path d="M 680,380 L 785,380 L 795,395 L 690,395 Z" fill="#18181b" stroke="#3b82f6" stroke-width="1"/>
  <!-- Rear Spoiler Wing -->
  <path d="M 730,290 L 785,275 L 780,285 L 725,300 Z" fill="#27272a" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Wheels & Chrome Rims -->
  <!-- Front Wheel -->
  <g transform="translate(230, 385)">
    <circle cx="0" cy="0" r="50" fill="#09090b" stroke="#27272a" stroke-width="6"/>
    <circle cx="0" cy="0" r="42" fill="#18181b" stroke="url(#chromeGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="#09090b" stroke="#3b82f6" stroke-width="3"/>
    <!-- Rim Spokes -->
    <line x1="-36" y1="0" x2="36" y2="0" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="-25" y1="-25" x2="25" y2="25" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="-25" y1="25" x2="25" y2="-25" stroke="url(#chromeGrad)" stroke-width="2.5"/>
  </g>

  <!-- Rear Wheel -->
  <g transform="translate(670, 385)">
    <circle cx="0" cy="0" r="50" fill="#09090b" stroke="#27272a" stroke-width="6"/>
    <circle cx="0" cy="0" r="42" fill="#18181b" stroke="url(#chromeGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="18" fill="#09090b" stroke="#3b82f6" stroke-width="3"/>
    <!-- Rim Spokes -->
    <line x1="-36" y1="0" x2="36" y2="0" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="0" y1="-36" x2="0" y2="36" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="-25" y1="-25" x2="25" y2="25" stroke="url(#chromeGrad)" stroke-width="2.5"/>
    <line x1="-25" y1="25" x2="25" y2="-25" stroke="url(#chromeGrad)" stroke-width="2.5"/>
  </g>

  <!-- Headlight & Taillight Beams -->
  <polygon points="120,340 50,330 50,370 120,360" fill="#ffffff" opacity="0.25" filter="url(#blurFilter)"/>
  <polygon points="780,335 840,325 840,365 780,355" fill="#3b82f6" opacity="0.35" filter="url(#blurFilter)"/>

  <!-- Typography / Model Badge Overlays -->
  <text x="450" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="url(#chromeGrad)" text-anchor="middle" letter-spacing="3">2013 SHELBY GT500 200+ MPH</text>
  <text x="450" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#3b82f6" text-anchor="middle" letter-spacing="4">GEN 5 (2005-2014)</text>
  <text x="450" y="132" font-family="monospace" font-weight="600" font-size="13" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">5.8L Trinity SC V8 • 662 HP • $54,200</text>
</svg>
